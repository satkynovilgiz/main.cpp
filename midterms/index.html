<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <title>De Anza Burger Kiosk</title>
</head>
<body>
    <div class="kiosk-container">
        <h1>🍔 De Anza Food Court</h1>
        <div class="menu-item">
            <span>De Anza Burger</span>
            <span class="price">$5.25</span>
            <input type="number" placeholder="0">
        </div>
        <div class="menu-item">
            <span>Bacon Cheese</span>
            <span class="price">$5.75</span>
            <input type="number" placeholder="0">
        </div>
        <div class="menu-item">
            <span>Mushroom Swiss</span>
            <span class="price">$5.95</span>
            <input type="number" placeholder="0">
        </div>
        
        <div class="user-type">
            <label><input type="radio" name="type"> Student (No Tax)</label>
            <label><input type="radio" name="type"> Staff (9% Tax)</label>
        </div>

        <button class="checkout-btn">Print Receipt</button>
    </div>
</body>
</html>
